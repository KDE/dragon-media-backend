include:
  - project: sysadmin/ci-utilities
    file:
      - /gitlab-templates/clang-format.yml
      - /gitlab-templates/reuse-lint.yml
      - /gitlab-templates/linux-qt6.yml
      - /gitlab-templates/linux-qt6-next.yml
      - /gitlab-templates/windows-qt6.yml
      - /gitlab-templates/freebsd-qt6.yml
      - /gitlab-templates/android-qt6.yml

build_clazy:
  extends:
    - .ci_linux_base
    - .suse_tumbleweed_qt6stable
  rules:
    # only run on merge requests
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    # where --only-setup-environment unpacked the prebuilt dependency packages
    CMAKE_PREFIX_PATH: "$CI_PROJECT_DIR/_install"
    LD_LIBRARY_PATH: "$CI_PROJECT_DIR/_install/lib64"
  script:
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - python3 -u ci-utilities/run-ci-build.py --project $CI_PROJECT_NAME --branch $CI_COMMIT_REF_NAME --platform Linux/Qt6/Shared --only-setup-environment
    - cmake --workflow --preset clazy
  artifacts: null
