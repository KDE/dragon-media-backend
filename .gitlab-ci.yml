include:
  - project: sysadmin/ci-utilities
    file:
      - /gitlab-templates/clang-format.yml
      - /gitlab-templates/reuse-lint.yml
      - /gitlab-templates/linux-qt6.yml
      - /gitlab-templates/linux-qt6-next.yml
      - /gitlab-templates/windows-qt6.yml
      - /gitlab-templates/freebsd-qt6.yml
      - /gitlab-templates/android-qt6.yml

suse_tumbleweed_qt611:
  before_script:
    - git clone https://invent.kde.org/sysadmin/ci-utilities.git --depth=1
    - git clone https://invent.kde.org/sysadmin/repo-metadata.git ci-utilities/repo-metadata/ --depth=1
    - git clone https://github.com/mborgerding/kissfft.git --depth=1 --branch 131.2.0 kissfft-src
  script:
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - python3 -u ci-utilities/run-ci-build.py --project $CI_PROJECT_NAME --branch $CI_COMMIT_REF_NAME --platform Linux/Qt6/Shared --extra-cmake-args=-DBUILD_WITH_QT6=ON --extra-cmake-args=-DQT_MAJOR_VERSION=6 --extra-cmake-args=-DECM_ENABLE_SANITIZERS='address;undefined'
    - |
      if [ -d "$INSTALLED_DOC_PATH" ]; then
        git clone https://invent.kde.org/websites/docs-kde-org.git --depth=1
        python3 ci-utilities/generate-documentation.py --project $CI_PROJECT_NAME --output-folder "generated_documentation" --format html pdf --branch $CI_COMMIT_REF_NAME --publish --doc-dir $INSTALLED_DOC_PATH
        mkdir -p public/
        mv generated_documentation/ public/documentation/
      fi

suse_tumbleweed_qt611_tsan:
  extends:
    - .ci_linux_base
    - .suse_tumbleweed_qt6stable
  stage: build
  variables:
    KDECI_PLATFORM_PATH: suse-qt6.11
  before_script:
    - git clone https://invent.kde.org/sysadmin/ci-utilities.git --depth=1
    - git clone https://invent.kde.org/sysadmin/repo-metadata.git ci-utilities/repo-metadata/ --depth=1
    - git clone https://github.com/mborgerding/kissfft.git --depth=1 --branch 131.2.0 kissfft-src
  script:
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - python3 -u ci-utilities/run-ci-build.py --project $CI_PROJECT_NAME --branch $CI_COMMIT_REF_NAME --platform Linux/Qt6/Shared --extra-cmake-args=-DBUILD_WITH_QT6=ON --extra-cmake-args=-DQT_MAJOR_VERSION=6 --extra-cmake-args=-DECM_ENABLE_SANITIZERS=thread --extra-cmake-args=-DBUILD_COVERAGE=OFF
  after_script:
    - ci-utilities/run-collect-crashes.py
  artifacts:
    expire_in: 2 weeks
    when: always
    paths:
      - "_build/tsan-logs/**"
    reports:
      junit: JUnitTestResults.xml

suse_tumbleweed_qt613:
  before_script:
    - git clone https://invent.kde.org/sysadmin/ci-utilities.git --depth=1
    - git clone https://invent.kde.org/sysadmin/repo-metadata.git ci-utilities/repo-metadata/ --depth=1
    - git clone https://github.com/mborgerding/kissfft.git --depth=1 --branch 131.2.0 kissfft-src

windows_qt611:
  before_script:
    - git clone https://invent.kde.org/sysadmin/ci-utilities.git --depth=1
    - git clone https://invent.kde.org/sysadmin/repo-metadata.git ci-utilities/repo-metadata/ --depth=1
    - git clone https://github.com/mborgerding/kissfft.git --depth=1 --branch 131.2.0 kissfft-src
    - git clone https://github.com/libsdl-org/SDL.git --depth=1 --branch release-3.4.12 sdl3-src

freebsd150_qt611:
  before_script:
    - git clone https://invent.kde.org/sysadmin/ci-utilities.git --depth=1
    - git clone https://invent.kde.org/sysadmin/repo-metadata.git ci-utilities/repo-metadata/ --depth=1
    - git clone https://github.com/mborgerding/kissfft.git --depth=1 --branch 131.2.0 kissfft-src
    - git clone https://github.com/libsdl-org/SDL.git --depth=1 --branch release-3.4.12 sdl3-src

android_qt611:
  before_script:
    - git clone https://invent.kde.org/sysadmin/ci-utilities.git --depth=1
    - git clone https://invent.kde.org/sysadmin/repo-metadata.git ci-utilities/repo-metadata/ --depth=1
  script:
    - bash ci/run-android-artifact-job.sh

.dragonqml_apk:
  stage: build
  image: storage.kde.org/vm-images/android-qt611-ci
  tags:
    - VM
    - amd64
  interruptible: true
  variables:
    DRAGON_ANDROID_DEPS_ROOT: "$CI_PROJECT_DIR/.ci-android-deps"
  retry: 1

dragonqml_apk_x86_64:
  extends: .dragonqml_apk
  script:
    - bash ci/run-apk-job.sh x86_64

dragonqml_apk_arm64:
  extends: .dragonqml_apk
  script:
    - bash ci/run-apk-job.sh arm64-v8a
